<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Система пропусків у бібліотеку</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/main.js" defer></script>
</head>
<body>
  <div id="notice" style="display: none; position: fixed; top: 10px; right: 10px; padding: 15px; border-radius: 5px; color: white; z-index: 1000;"></div>

  <header>
    <div class="container">
      <h1>Система пропусків у бібліотеку</h1>
    </div>
  </header>

  <main class="container">
    <section id="form-section">
      <h2>Новий пропуск</h2>
      <form id="passForm">
        <div class="field">
          <label for="userIdSelect">Студент / Викладач</label>
          <select id="userIdSelect" required>
            <option value="">Завантаження...</option>
          </select>
        </div>

        <div class="field">
          <label for="zoneIdSelect">Зал бібліотеки</label>
          <select id="zoneIdSelect" required>
            <option value="">Завантаження...</option>
          </select>
        </div>

        <div class="field">
          <label for="reasonSelect">Причина доступу</label>
          <select id="reasonSelect" required>
            <option value="">Оберіть причину</option>
            <option value="Навчання">Навчання</option>
            <option value="Лабораторна робота">Лабораторна робота</option>
            <option value="Робота над проектом">Робота над проектом</option>
            <option value="Технічне обслуговування">Технічне обслуговування</option>
          </select>
        </div>

        <div class="field">
          <label for="validDateInput">Дійсний до (дата)</label>
          <input id="validDateInput" type="date" required />
        </div>

        <div class="field">
          <label for="issuerInput">Видав (ПІБ)</label>
          <input id="issuerInput" type="text" required />
        </div>

        <div class="field">
          <label for="commentInput">Коментар (необов'язково)</label>
          <textarea id="commentInput" rows="3"></textarea>
        </div>

        <div class="buttons">
          <button type="submit" id="submitBtn">Створити пропуск</button>
        </div>
      </form>
    </section>

    <section id="list-section">
      <h2>Реєстр виданих пропусків</h2>
      <div id="listStatus" style="margin-bottom: 15px; font-weight: bold;"></div>
      <table id="passesTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Користувач</th>
            <th>Зал</th>
            <th>Причина</th>
            <th>Дата дії</th>
            <th>Видав</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody id="passesTableBody">
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
